services:
  - type: web
    name: ppc-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: starter
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: MODE
        value: cloud
      - key: AUTH_ENABLED
        value: "true"
      - key: STORAGE_BACKEND
        value: s3
      - key: DATABASE_URL
        fromDatabase:
          name: ppc-postgres
          property: connectionString

  - type: worker
    name: ppc-worker
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    dockerCommand: python -m app.worker
    plan: starter
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: MODE
        value: cloud
      - key: AUTH_ENABLED
        value: "true"
      - key: STORAGE_BACKEND
        value: s3
      - key: DATABASE_URL
        fromDatabase:
          name: ppc-postgres
          property: connectionString

  - type: web
    name: ppc-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    plan: starter
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE
        value: https://ppc-backend.onrender.com/api

databases:
  - name: ppc-postgres
    databaseName: ppc
    user: ppc
